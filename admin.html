<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Ambara Sail Aquatic</title>
<link rel="stylesheet" href="admin.css">
<style>
body{font-family:Arial,sans-serif}.hidden{display:none!important}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001;max-width:460px;width:100%}.login input{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:13px;border:1px solid #ddd;border-radius:10px}.login button{width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#fff0f0;color:#a00;white-space:pre-wrap}.ok{background:#effaf0;color:#176b22}.debug{font-size:12px;color:#666;margin-top:14px}
</style>
</head>
<body>
<div id="loginView" class="center"><div class="panel login">
<div class="brand">🏊 <b>Ambara Sail Aquatic</b></div><h1>Admin Login</h1>
<p>Masuk untuk mengelola data Ambara Sail Aquatic.</p>
<form id="loginForm">
<input id="email" type="email" required autocomplete="username" placeholder="Email admin">
<input id="password" type="password" required autocomplete="current-password" placeholder="Password">
<button id="loginBtn" type="submit">Masuk</button>
<div id="loginMsg" class="msg hidden"></div>
</form>
<div id="debug" class="debug">Memuat sistem login...</div>
<a href="index.html">← Kembali ke website</a>
</div></div>
<div id="appView" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const URL='https://kahyuedvhhkeezolnkeh.supabase.co';
const KEY='sb_publishable_qaQ1yUb1JsF_nJRbY2b6mw_o0z9weT4';
const msg=document.getElementById('loginMsg'), debug=document.getElementById('debug'), btn=document.getElementById('loginBtn');
function show(t,ok){msg.textContent=t;msg.className='msg'+(ok?' ok':'');msg.classList.remove('hidden')}
function setDebug(t){debug.textContent=t}
if(!window.supabase){show('Library Supabase gagal dimuat. Periksa koneksi internet lalu refresh halaman.');setDebug('ERROR: Supabase JS tidak tersedia.');return;}
const sb=window.supabase.createClient(URL,KEY);
setDebug('Sistem login siap.');
async function checkSession(){
 try{const {data,error}=await sb.auth.getSession();if(error){show('Gagal memeriksa sesi: '+error.message);return;}if(data.session){setDebug('Sesi ditemukan. Memeriksa akun admin...');await checkAdmin(data.session.user);}}
 catch(e){show('Kesalahan sistem: '+(e?.message||e));}
}
async function checkAdmin(user){
 try{
  const {data,error}=await sb.rpc('is_admin');
  if(error){show('Login belum dapat memeriksa status admin.\n\n'+error.message+'\n\nJika login sebenarnya berhasil, fungsi is_admin di database perlu diperbaiki.');setDebug('RPC is_admin gagal.');return false;}
  if(data===true){window.location.href='admin-dashboard.html';return true;}
  show('Akun berhasil login, tetapi belum terdaftar sebagai admin.');setDebug('User ID: '+user.id);return false;
 }catch(e){show('Gagal memeriksa admin: '+(e?.message||e));return false;}
}
document.getElementById('loginForm').addEventListener('submit',async function(e){
 e.preventDefault();
 btn.disabled=true;btn.textContent='Memproses...';show('Menghubungkan ke Supabase...',true);
 try{
  const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){show('Login gagal:\n'+error.message);setDebug('Supabase menolak login.');return;}
  if(!data.session){show('Login tidak menghasilkan sesi.');return;}
  setDebug('Login berhasil. Memeriksa hak admin...');
  await checkAdmin(data.user);
 }catch(e){show('Kesalahan JavaScript:\n'+(e?.message||e));setDebug('Terjadi exception.');}
 finally{btn.disabled=false;btn.textContent='Masuk';}
});
checkSession();
})();
</script>
</body></html>
