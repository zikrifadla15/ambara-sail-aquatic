<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ambara Sail Aquatic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="admin.css"></head>
<body><div id="loginView" class="center"><div class="panel login"><div class="brand">🏊 <b>Ambara Sail Aquatic</b></div><h1>Admin Login</h1><p>Masuk untuk mengelola siswa, coach, jadwal, absensi, dan pembayaran.</p><form id="loginForm"><input id="email" type="email" required placeholder="Email admin"><input id="password" type="password" required placeholder="Password"><button>Masuk</button><div id="loginMsg" class="msg"></div></form><a href="index.html">← Kembali ke website</a></div></div>
<div id="appView" class="hidden"><aside><div class="brand">🏊 <b>Ambara Sail Aquatic</b></div><nav><button data-tab="dashboard">📊 Dashboard</button><button data-tab="students">👨‍🎓 Siswa</button><button data-tab="coaches">🏊 Coach</button><button data-tab="schedules">📅 Jadwal</button><button data-tab="attendance">✅ Absensi</button><button data-tab="payments">💰 Pembayaran</button></nav><button id="logout" class="logout">Keluar</button></aside><main><header><div><p class="eyebrow">ADMIN PANEL</p><h1 id="pageTitle">Dashboard</h1></div><a href="index.html" target="_blank">Lihat website ↗</a></header><div id="content"></div></main></div>
<script>
const URL='https://kahyuedvhhkeezolnkeh.supabase.co';const KEY='sb_publishable_qaQ1yUb1JsF_nJRbY2b6mw_o0z9weT4';const sb=window.supabase.createClient(URL,KEY);
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function msg(t,ok=false){return `<div class="msg ${ok?'ok':''}">${esc(t)}</div>`}
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}if(await isAdmin())showApp();else{await sb.auth.signOut();showLogin('Akun ini bukan akun admin.')}}
function showLogin(error=''){ $('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');if(error)$('#loginMsg').innerHTML=msg(error)}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');render('dashboard') }
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginMsg').textContent='Memproses...';const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginMsg').innerHTML=msg(error.message);return}if(!(await isAdmin())){await sb.auth.signOut();$('#loginMsg').innerHTML=msg('Login berhasil, tetapi akun ini belum terdaftar sebagai admin.');return}showApp()});
$('#logout').addEventListener('click',async()=>{await sb.auth.signOut();showLogin()});
$$('nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));
async function render(tab){$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#pageTitle').textContent={dashboard:'Dashboard',students:'Data Siswa',coaches:'Data Coach',schedules:'Jadwal',attendance:'Absensi',payments:'Pembayaran'}[tab];if(tab==='dashboard')return dashboard();if(tab==='students')return students();if(tab==='coaches')return coaches();if(tab==='schedules')return schedules();if(tab==='attendance')return attendance();if(tab==='payments')return payments()}
async function count(table){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});return error?0:count||0}
async function dashboard(){const [s,c,j,a,p]=await Promise.all(['students','coaches','schedules','attendance','payments'].map(count));const {data:pay}=await sb.from('payments').select('amount').eq('status','lunas');const total=(pay||[]).reduce((x,r)=>x+Number(r.amount||0),0);$('#content').innerHTML=`<div class="cards"><div class="stat"><span>👨‍🎓</span><b>${s}</b><small>Siswa</small></div><div class="stat"><span>🏊</span><b>${c}</b><small>Coach</small></div><div class="stat"><span>📅</span><b>${j}</b><small>Jadwal</small></div><div class="stat"><span>✅</span><b>${a}</b><small>Absensi</small></div><div class="stat"><span>💰</span><b>Rp ${total.toLocaleString('id-ID')}</b><small>Pembayaran lunas</small></div></div><div class="panel"><h2>Selamat datang 👋</h2><p>Gunakan menu di kiri untuk mengelola data Ambara Sail Aquatic.</p></div>`}
function tableShell(title,form,table){$('#content').innerHTML=`<div class="grid2"><div class="panel"><h2>${title}</h2>${form}</div><div class="panel"><h2>Daftar</h2>${table}</div></div>`}
async function students(){const {data,error}=await sb.from('students').select('*').order('created_at',{ascending:false});let rows=(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.age)}</td><td>${esc(x.phone)}</td><td>${esc(x.program)}</td><td>${esc(x.status)}</td><td><button class="danger sm" onclick="del('students','${x.id}',students)">Hapus</button></td></tr>`).join('');tableShell('Tambah siswa',`<form id="studentForm"><input id="sn" required placeholder="Nama"><input id="sa" type="number" placeholder="Usia"><input id="sp" placeholder="No. WhatsApp"><input id="sparent" placeholder="Nama orang tua"><input id="saddr" placeholder="Alamat"><select id="sprog"><option>Privat</option><option>Semi Privat</option><option>Group Class</option></select><input id="spack" placeholder="Paket (contoh: 4x pertemuan)"><button>Simpan siswa</button><div id="sm"></div></form>`,`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>Usia</th><th>WA</th><th>Program</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${error?msg(error.message):''}`);$('#studentForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('students').insert({name:$('#sn').value,age:Number($('#sa').value)||null,phone:$('#sp').value,parent_name:$('#sparent').value,address:$('#saddr').value,program:$('#sprog').value,package:$('#spack').value});$('#sm').innerHTML=error?msg(error.message):msg('Siswa berhasil disimpan.',true);if(!error)students()}}
async function coaches(){const {data,error}=await sb.from('coaches').select('*').order('created_at',{ascending:false});let rows=(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.specialization)}</td><td>${esc(x.status)}</td><td><button class="danger sm" onclick="del('coaches','${x.id}',coaches)">Hapus</button></td></tr>`).join('');tableShell('Tambah coach',`<form id="coachForm"><input id="cn" required placeholder="Nama coach"><input id="cp" placeholder="No. WhatsApp"><input id="cs" placeholder="Spesialisasi"><button>Simpan coach</button><div id="cm"></div></form>`,`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>WA</th><th>Spesialisasi</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${error?msg(error.message):''}`);$('#coachForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('coaches').insert({name:$('#cn').value,phone:$('#cp').value,specialization:$('#cs').value});$('#cm').innerHTML=error?msg(error.message):msg('Coach berhasil disimpan.',true);if(!error)coaches()}}
async function options(){const [{data:s},{data:c}]=await Promise.all([sb.from('students').select('id,name').order('name'),sb.from('coaches').select('id,name').order('name')]);return {s:s||[],c:c||[]}}
async function schedules(){const {s,c}=await options();const {data,error}=await sb.from('schedules').select('*,students(name),coaches(name)').order('date',{ascending:false}).order('start_time',{ascending:false});let rows=(data||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.start_time)}</td><td>${esc(x.students?.name)}</td><td>${esc(x.coaches?.name)}</td><td>${esc(x.program)}</td><td>${esc(x.location)}</td><td><button class="danger sm" onclick="del('schedules','${x.id}',schedules)">Hapus</button></td></tr>`).join('');const so=s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''),co=c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');tableShell('Tambah jadwal',`<form id="scheduleForm"><select id="js" required>${so||'<option value="">Belum ada siswa</option>'}</select><select id="jc">${co||'<option value="">Belum ada coach</option>'}</select><input id="jd" type="date" required><input id="jt" type="time" required><input id="je" type="time"><select id="jp"><option>Privat</option><option>Semi Privat</option><option>Group Class</option></select><select id="jl"><option>Modernland</option><option>Pabuaran Residence</option></select><button>Simpan jadwal</button><div id="jm"></div></form>`,`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Siswa</th><th>Coach</th><th>Program</th><th>Lokasi</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${error?msg(error.message):''}`);$('#scheduleForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('schedules').insert({student_id:$('#js').value,coach_id:$('#jc').value||null,date:$('#jd').value,start_time:$('#jt').value,end_time:$('#je').value||null,program:$('#jp').value,location:$('#jl').value});$('#jm').innerHTML=error?msg(error.message):msg('Jadwal berhasil disimpan.',true);if(!error)schedules()}}
async function attendance(){const {s}=await options();const {data,error}=await sb.from('attendance').select('*,students(name)').order('attendance_date',{ascending:false});let rows=(data||[]).map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${esc(x.students?.name)}</td><td>${esc(x.status)}</td><td>${esc(x.notes)}</td><td><button class="danger sm" onclick="del('attendance','${x.id}',attendance)">Hapus</button></td></tr>`).join('');const so=s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');tableShell('Catat absensi',`<form id="attendanceForm"><select id="as" required>${so||'<option value="">Belum ada siswa</option>'}</select><input id="ad" type="date" required><select id="ast"><option>hadir</option><option>izin</option><option>sakit</option><option>alpa</option></select><textarea id="an" placeholder="Catatan"></textarea><button>Simpan absensi</button><div id="am"></div></form>`,`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Siswa</th><th>Status</th><th>Catatan</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${error?msg(error.message):''}`);$('#attendanceForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('attendance').insert({student_id:$('#as').value,attendance_date:$('#ad').value,status:$('#ast').value,notes:$('#an').value});$('#am').innerHTML=error?msg(error.message):msg('Absensi berhasil disimpan.',true);if(!error)attendance()}}
async function payments(){const {s}=await options();const {data,error}=await sb.from('payments').select('*,students(name)').order('payment_date',{ascending:false});let rows=(data||[]).map(x=>`<tr><td>${esc(x.payment_date)}</td><td>${esc(x.students?.name)}</td><td>Rp ${Number(x.amount||0).toLocaleString('id-ID')}</td><td>${esc(x.payment_method)}</td><td>${esc(x.status)}</td><td><button class="danger sm" onclick="del('payments','${x.id}',payments)">Hapus</button></td></tr>`).join('');const so=s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');tableShell('Catat pembayaran',`<form id="paymentForm"><select id="ps" required>${so||'<option value="">Belum ada siswa</option>'}</select><input id="pd" type="date" required><input id="pa" type="number" min="0" required placeholder="Nominal (Rp)"><select id="pm"><option>Transfer</option><option>Cash</option><option>QRIS</option><option>Lainnya</option></select><select id="pst"><option>lunas</option><option>belum lunas</option></select><input id="pp" placeholder="Paket"><textarea id="pn" placeholder="Catatan"></textarea><button>Simpan pembayaran</button><div id="pmsg"></div></form>`,`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Siswa</th><th>Nominal</th><th>Metode</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${error?msg(error.message):''}`);$('#paymentForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('payments').insert({student_id:$('#ps').value,payment_date:$('#pd').value,amount:Number($('#pa').value),payment_method:$('#pm').value,status:$('#pst').value,package:$('#pp').value,notes:$('#pn').value});$('#pmsg').innerHTML=error?msg(error.message):msg('Pembayaran berhasil disimpan.',true);if(!error)payments()}}
async function del(table,id,fn){if(!confirm('Hapus data ini?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)alert(error.message);else fn()}
boot();
</script></body></html>
