<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambara Sail Aquatic — Portal</title><link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head><body class="login-page">
<div class="login-card">
  <div class="brand">🏊 <span>Ambara Sail Aquatic</span></div>
  <p class="muted">Portal Admin • Siswa • Coach</p>
  <div class="role-pills"><button class="pill active" data-role="student">Siswa</button><button class="pill" data-role="coach">Coach</button><button class="pill" data-role="admin">Admin</button></div>
  <form id="loginForm">
    <label id="identifierLabel">Nomor HP / ID Siswa</label><input id="identifier" placeholder="Contoh: SIS-ABC123 / 08xxxxxxxxxx" required>
    <label>Password / PIN</label><input id="password" type="password" placeholder="Password / PIN" required>
    <button class="btn primary full">🔐 Login</button>
  </form>
  <p id="loginMsg" class="error"></p>
  <div class="notice">Gunakan akun yang dibuat/diaktifkan oleh Admin Ambara Sail Aquatic.</div>
</div>
<script>
let role="student";
document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));b.classList.add("active");role=b.dataset.role;document.querySelector("#identifierLabel").textContent=role==="admin"?"Email Admin":"Nomor HP / ID "+(role==="student"?"Siswa":"Coach");document.querySelector("#identifier").placeholder=role==="admin"?"admin@email.com":"Contoh: "+(role==="student"?"SIS-ABC123 / 08xxxxxxxxxx":"COA-ABC123 / 08xxxxxxxxxx")});
document.querySelector("#loginForm").onsubmit=async e=>{
 e.preventDefault();const id=document.querySelector("#identifier").value.trim(),pw=document.querySelector("#password").value;
 document.querySelector("#loginMsg").textContent="Memproses...";
 let email=id;
 if(role!=="admin"){const {data,error}=await db.rpc("login_email_for_identifier",{identifier:id});if(error||!data){document.querySelector("#loginMsg").textContent="ID/nomor HP tidak ditemukan.";return}email=data}
 const {data,error}=await db.auth.signInWithPassword({email,password:pw});
 if(error){document.querySelector("#loginMsg").textContent=error.message;return}
 const {data:p}=await db.from("user_profiles").select("role").eq("user_id",data.user.id).maybeSingle();
 const {data:isAdmin}=await db.rpc("is_admin");
 if(role==="admin" && !isAdmin){await db.auth.signOut();document.querySelector("#loginMsg").textContent="Akun bukan Admin.";return}
 if(role==="student" && (!p||p.role!=="student")){await db.auth.signOut();document.querySelector("#loginMsg").textContent="Akun bukan Siswa.";return}
 if(role==="coach" && (!p||p.role!=="coach")){await db.auth.signOut();document.querySelector("#loginMsg").textContent="Akun bukan Coach.";return}
 location.href=role+".html";
};
</script></body></html>
