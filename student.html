<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Siswa</title>
<link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script></head>
<body><header class="top"><h1>🏊 Portal Siswa — Ambara Sail Aquatic</h1><button class="btn secondary" onclick="logout()">Logout</button></header>
<main class="wrap"><div class="nav"><button class="active" data-tab="home">Dashboard</button><button data-tab="profile">👤 Profil</button><button data-tab="progress">📊 Perkembangan</button><button data-tab="schedule">📅 Jadwal</button><button data-tab="attendance">✅ Absensi</button><button data-tab="events">🏆 Sub Event</button><button data-tab="pools">🏊 Kolam</button><button data-tab="payments">💰 Pembayaran</button><button data-tab="notif">🔔 Reminder</button></div>
<section id="home" class="panel active"><div id="profileCard"></div><div class="grid" id="stats"></div><div class="form-card"><h2>📈 Grafik Perkembangan</h2><div id="chart"></div></div></section>
<section id="profile" class="panel"><div class="form-card"><h2>👤 Profil Saya</h2><div id="profileForm"></div></div></section>
<section id="progress" class="panel"><div class="form-card"><h2>📊 Hasil Evaluasi</h2><div id="evalList"></div></div></section>
<section id="schedule" class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Coach</th><th>Lokasi</th><th>Program</th><th>Status</th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section>
<section id="attendance" class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kehadiran</th><th>Catatan</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></section>
<section id="events" class="panel"><div class="event-grid" id="eventList"></div></section>
<section id="pools" class="panel"><div class="event-grid" id="poolList"></div></section>
<section id="payments" class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nominal</th><th>Metode</th><th>Paket</th><th>Status</th></tr></thead><tbody id="paymentRows"></tbody></table></div></section>
<section id="notif" class="panel"><div id="notifList"></div></section><div id="toast" class="toast"></div></main>
<script>
let ctx,student,coach,evals=[];
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")});
async function init(){ctx=await requireLogin(["student"]);if(!ctx)return;
 const {data:s,error}=await db.from("students").select("*").eq("auth_user_id",ctx.user.id).maybeSingle();if(error||!s){toast("Profil siswa belum terhubung ke akun.",false);return}student=s;
 const [ev,sc,att,pay,events,pools,notes]=await Promise.all([
  db.from("student_evaluations").select("*,coaches(name)").eq("student_id",s.id).order("evaluation_date",{ascending:true}),
  db.from("schedules").select("*,coaches(name)").eq("student_id",s.id).order("date",{ascending:false}),
  db.from("attendance").select("*").eq("student_id",s.id).order("attendance_date",{ascending:false}),
  db.from("payments").select("*").eq("student_id",s.id).order("payment_date",{ascending:false}),
  db.from("events").select("*,pools(name)").order("event_date",{ascending:true}),
  db.from("pools").select("*").order("name"),
  db.from("notifications").select("*").eq("user_id",ctx.user.id).order("created_at",{ascending:false})
 ]);evals=ev.data||[];renderProfile();renderHome();renderEval();renderSchedules(sc.data||[]);renderAttendance(att.data||[]);renderPayments(pay.data||[]);renderEvents(events.data||[]);renderPools(pools.data||[]);renderNotes(notes.data||[])}

function profilePhotoUrl(){
 if(student.photo_path){
  return db.storage.from("profile-photos").getPublicUrl(student.photo_path).data.publicUrl+"?v="+Date.now();
 }
 return student.photo_url||"";
}

function renderProfile(){
 const photo=profilePhotoUrl();
 profileCard.innerHTML=`<div class="card profile-head"><div class="avatar">${photo?`<img class="avatar" src="${esc(photo)}" alt="Foto ${esc(student.name)}">`:"🏊"}</div><div><h2>${esc(student.name)}</h2><span class="badge">${esc(student.level||"Beginner")}</span><p class="small">${esc(student.program)} • ${esc(student.package)} • ID ${esc(student.student_code)}</p></div></div>`;

 profileForm.innerHTML=`<div class="form-grid">
 <div><label>Nama</label><input id="p_name" value="${esc(student.name)}"></div>
 <div><label>Usia</label><input id="p_age" type="number" min="1" max="120" value="${esc(student.age||"")}"></div>
 <div><label>No. HP</label><input id="p_phone" value="${esc(student.phone||"")}"></div>
 <div><label>Jenis Kelamin</label><select id="p_gender"><option value="">Pilih</option><option value="Laki-laki" ${student.gender==="Laki-laki"?"selected":""}>Laki-laki</option><option value="Perempuan" ${student.gender==="Perempuan"?"selected":""}>Perempuan</option></select></div>
 <div><label>Upload Foto Profil</label><input id="p_photo_file" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png"><div class="small">Pilih foto JPG/JPEG/PNG, maksimal 2 MB.</div></div>
 <div><label>Kontak Darurat</label><input id="p_emergency" value="${esc(student.emergency_contact||"")}"></div>
 <div class="full-span"><label>Alamat</label><input id="p_address" value="${esc(student.address||"")}"></div>
 <div class="full-span"><label>Biodata/Catatan</label><textarea id="p_bio">${esc(student.bio||student.notes||"")}</textarea></div>
 </div><button class="btn primary" style="margin-top:12px" onclick="saveProfile()">Simpan Profil</button>`;
}

async function uploadStudentPhoto(file){
 if(!file)return null;
 if(!["image/jpeg","image/png"].includes(file.type)){toast("Foto harus JPG, JPEG, atau PNG.",false);return false}
 if(file.size>2*1024*1024){toast("Ukuran foto maksimal 2 MB.",false);return false}
 const ext=file.type==="image/png"?"png":"jpg";
 const path=`students/${student.id}/profile.${ext}`;
 const {error}=await db.storage.from("profile-photos").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});
 if(error){toast("Upload foto gagal: "+error.message,false);return false}
 return path;
}

async function saveProfile(){
 const file=document.getElementById("p_photo_file")?.files?.[0]||null;
 let photoPath=student.photo_path||null;
 if(file){
  const uploaded=await uploadStudentPhoto(file);
  if(uploaded===false)return;
  photoPath=uploaded;
 }
 const data={
  name:document.getElementById("p_name").value,
  age:Number(document.getElementById("p_age").value)||null,
  phone:document.getElementById("p_phone").value,
  gender:document.getElementById("p_gender").value,
  photo_path:photoPath,
  emergency_contact:document.getElementById("p_emergency").value,
  address:document.getElementById("p_address").value,
  bio:document.getElementById("p_bio").value
 };
 const {error}=await db.from("students").update(data).eq("id",student.id);
 if(error){toast(error.message,false);return}
 if(file&&student.photo_path&&student.photo_path!==photoPath){await db.storage.from("profile-photos").remove([student.photo_path])}
 Object.assign(student,data);
 renderProfile();renderHome();
 toast(file?"Profil dan foto berhasil diperbarui.":"Profil berhasil diperbarui.");
}

function renderHome(){let last=evals.at(-1),scores=evals.map(x=>x.overall_score||0),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;stats.innerHTML=[["⭐ Nilai Terakhir",last?.overall_score??"-"],["📈 Rata-rata",avg||"-"],["🏆 Level",student.level||last?.level||"Beginner"],["📝 Evaluasi",evals.length]].map(x=>`<div class="card"><h3>${x[0]}</h3><div class="big">${esc(x[1])}</div></div>`).join("");chart.innerHTML=scores.length?`<div class="chart">${scores.map((s,i)=>`<div class="chart-col"><b>${s}</b><div class="chart-bar" style="height:${Math.max(4,s*2.1)}px"></div><span class="small">Eval ${i+1}</span></div>`).join("")}</div>`:"<p class='small'>Belum ada evaluasi.</p>";}
function renderEval(){evalList.innerHTML=evals.slice().reverse().map(x=>`<div class="form-card"><div class="toolbar"><h3>Evaluasi ${fmtDate(x.evaluation_date)}</h3><span class="score">${x.overall_score??"-"}/100</span></div><p><b>Level:</b> ${esc(x.level||"-")} • Coach: ${esc(x.coaches?.name||"-")}</p><div class="bars">${[["Mengapung",x.floating_score],["Pernapasan",x.breathing_score],["Gaya bebas",x.freestyle_score],["Gaya dada",x.breaststroke_score],["Gaya punggung",x.backstroke_score],["Gaya kupu-kupu",x.butterfly_score],["Loncat/masuk kolam",x.water_entry_score],["Kepercayaan diri",x.confidence_score]].map(a=>`<div><div class="toolbar"><span>${a[0]}</span><b>${a[1]??"-"}</b></div><div class="bar"><i style="width:${a[1]||0}%"></i></div></div>`).join("")}</div><p><b>Catatan Coach:</b> ${esc(x.notes||"-")}</p></div>`).join("")||"<p>Belum ada evaluasi.</p>"}
function renderSchedules(a){scheduleRows.innerHTML=a.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.start_time||"")} ${x.end_time?"- "+esc(x.end_time):""}</td><td>${esc(x.coaches?.name||"-")}</td><td>${esc(x.location||"-")}</td><td>${esc(x.program||"-")}</td><td>${esc(x.status||"-")}</td></tr>`).join("")||"<tr><td colspan='6'>Belum ada jadwal.</td></tr>"}
function renderAttendance(a){attendanceRows.innerHTML=a.map(x=>`<tr><td>${fmtDate(x.attendance_date)}</td><td>${esc(x.status)}</td><td>${esc(x.notes||"-")}</td></tr>`).join("")||"<tr><td colspan='3'>Belum ada riwayat.</td></tr>"}
function renderPayments(a){paymentRows.innerHTML=a.map(x=>`<tr><td>${fmtDate(x.payment_date)}</td><td>${rupiah(x.amount)}</td><td>${esc(x.payment_method||"-")}</td><td>${esc(x.package||"-")}</td><td>${esc(x.status||"-")}</td></tr>`).join("")||"<tr><td colspan='5'>Belum ada pembayaran.</td></tr>"}
function renderEvents(a){eventList.innerHTML=a.map(x=>`<div class="event-card"><span class="badge">Sub Event</span><h3>${esc(x.title)}</h3><p>${esc(x.description||"")}</p><p>📅 ${fmtDate(x.event_date)} ${x.start_time||""}</p><p>📍 ${esc(x.location||x.pools?.name||"-")}</p></div>`).join("")||"<p>Belum ada event.</p>"}
function renderPools(a){poolList.innerHTML=a.map(x=>`<div class="event-card"><h3>🏊 ${esc(x.name)}</h3><p>${esc(x.address||"")}</p><p>${esc(x.facilities||"")}</p>${x.map_url?`<a href="${esc(x.map_url)}" target="_blank">Lihat Maps</a>`:""}</div>`).join("")||"<p>Belum ada kolam.</p>"}
function renderNotes(a){notifList.innerHTML=a.map(x=>`<div class="notice-card"><b>${esc(x.title)}</b><p>${esc(x.message)}</p><span class="small">${new Date(x.created_at).toLocaleString("id-ID")}</span></div>`).join("")||"<p>Belum ada reminder.</p>"}
init();
</script></body></html>
