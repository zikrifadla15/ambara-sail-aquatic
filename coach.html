<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Coach</title>
<link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script></head>
<body><header class="top"><h1>🏊 Portal Coach — Ambara Sail Aquatic</h1><button class="btn secondary" onclick="logout()">Logout</button></header><main class="wrap">
<div class="nav" id="coachNav">
<button type="button" class="active" onclick="switchCoachTab('home',this)">Dashboard</button>
<button type="button" onclick="switchCoachTab('profile',this)">👤 Profil</button>
<button type="button" onclick="switchCoachTab('schedule',this)">📅 Jadwal</button>
<button type="button" onclick="switchCoachTab('students',this)">👨‍🎓 Siswa</button>
<button type="button" onclick="switchCoachTab('events',this)">🏆 Sub Event</button>
<button type="button" onclick="switchCoachTab('pools',this)">🏊 Kolam</button>
<button type="button" onclick="switchCoachTab('income',this)">💰 Gaji/Pendapatan</button>
<button type="button" onclick="switchCoachTab('notif',this)">🔔 Reminder</button>
</div>
<section id="home" class="panel active"><div class="grid" id="stats"></div><div class="form-card"><h2>Jadwal Terdekat</h2><div id="nextSchedule"></div></div></section>
<section id="profile" class="panel"><div class="form-card"><h2>👤 Profil Coach</h2><div id="profileForm"></div></div></section>
<section id="schedule" class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Siswa</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section>
<section id="students" class="panel"><div class="table-wrap"><table><thead><tr><th>Siswa</th><th>Program</th><th>Level</th><th>Pertemuan</th><th>Aksi</th></tr></thead><tbody id="studentRows"></tbody></table></div></section>
<section id="events" class="panel"><div class="event-grid" id="eventList"></div></section><section id="pools" class="panel"><div class="event-grid" id="poolList"></div></section>
<section id="income" class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nominal</th><th>Tipe</th><th>Status</th><th>Catatan</th></tr></thead><tbody id="incomeRows"></tbody></table></div></section>
<section id="notif" class="panel"><div id="notifList"></div></section>
<div id="evalModal" class="login-card" style="display:none;position:fixed;inset:5%;z-index:30;overflow:auto;max-width:700px;margin:auto"><h2>Tambah Evaluasi</h2><input type="hidden" id="e_student"><label>Tanggal</label><input id="e_date" type="date"><div class="form-grid" id="scoreInputs"></div><label>Level</label><select id="e_level"><option>Beginner</option><option>Basic</option><option>Intermediate</option><option>Advanced</option></select><label>Nilai keseluruhan 0-100</label><input id="e_overall" type="number" min="0" max="100"><label>Catatan Coach</label><textarea id="e_notes"></textarea><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="closeEval()">Batal</button><button class="btn primary" onclick="saveEval()">Simpan Evaluasi</button></div></div><div id="toast" class="toast"></div></main>
<style>
.nav{position:relative;z-index:1000;pointer-events:auto}
.nav button{position:relative;z-index:1001;pointer-events:auto;cursor:pointer}
.panel{display:none}
.panel.active{display:block}
</style>
<script>
function switchCoachTab(tab,btn){
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  if(btn) btn.classList.add("active");
  const panel=document.getElementById(tab);
  if(panel) panel.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
let ctx,coach,schedules=[],students=[];

const skills=[["floating_score","Mengapung"],["breathing_score","Pernapasan"],["freestyle_score","Gaya bebas"],["breaststroke_score","Gaya dada"],["backstroke_score","Gaya punggung"],["butterfly_score","Gaya kupu-kupu"],["water_entry_score","Loncat/masuk kolam"],["confidence_score","Kepercayaan diri"]];
function openEval(id){e_student.value=id;e_date.value=new Date().toISOString().slice(0,10);e_overall.value="";e_notes.value="";scoreInputs.innerHTML=skills.map(s=>`<div><label>${s[1]}</label><input id="${s[0]}" type="number" min="0" max="100" placeholder="0-100"></div>`).join("");evalModal.style.display="block"}
function closeEval(){evalModal.style.display="none"}
async function init(){ctx=await requireLogin(["coach"]);if(!ctx)return;const {data:c}=await db.from("coaches").select("*").eq("auth_user_id",ctx.user.id).maybeSingle();if(!c){toast("Profil coach belum terhubung.",false);return}coach=c;
 const [sc,ev,pay,events,pools,notes]=await Promise.all([
  db.from("schedules").select("*,students(id,name,program,level,meeting_count)").eq("coach_id",c.id).order("date",{ascending:false}),
  db.from("student_evaluations").select("student_id").eq("coach_id",c.id),
  db.from("coach_payments").select("*").eq("coach_id",c.id).order("payment_date",{ascending:false}),
  db.from("events").select("*,pools(name)").order("event_date"),
  db.from("pools").select("*").order("name"),
  db.from("notifications").select("*").eq("user_id",ctx.user.id).order("created_at",{ascending:false})
 ]);schedules=sc.data||[];students=[...new Map(schedules.filter(x=>x.students).map(x=>[x.students.id,x.students])).values()];renderHome();renderProfile();renderSchedules();renderStudents();renderEvents(events.data||[]);renderPools(pools.data||[]);renderIncome(pay.data||[]);renderNotes(notes.data||[])}
function renderHome(){stats.innerHTML=[["📅 Jadwal",schedules.length],["👨‍🎓 Siswa",students.length],["📝 Evaluasi",0],["💰 Pendapatan",0]].map(x=>`<div class="card"><h3>${x[0]}</h3><div class="big">${x[1]}</div></div>`).join("");nextSchedule.innerHTML=schedules.slice(0,5).map(x=>`<div class="notice-card"><b>${fmtDate(x.date)} ${esc(x.start_time||"")}</b> — ${esc(x.students?.name||"-")}<br><span class="small">${esc(x.location||"-")} • ${esc(x.status||"-")}</span></div>`).join("")||"Belum ada jadwal."}
function profilePhotoUrl(){if(coach.photo_path){return db.storage.from("profile-photos").getPublicUrl(coach.photo_path).data.publicUrl+"?v="+Date.now()}return coach.photo_url||""}
function renderProfile(){const photo=profilePhotoUrl();profileForm.innerHTML=`<div class="profile-head" style="margin-bottom:16px"><div class="avatar">${photo?`<img class="avatar" src="${esc(photo)}" alt="Foto ${esc(coach.name)}">`:"🏊"}</div><div><b>Foto Profil Coach</b><div class="small">Upload JPG/JPEG/PNG maksimal 2 MB.</div></div></div><div class="form-grid"><div><label>Nama</label><input id="c_name" value="${esc(coach.name)}"></div><div><label>No. HP</label><input id="c_phone" value="${esc(coach.phone||"")}"></div><div><label>Email</label><input id="c_email" value="${esc(coach.email||"")}"></div><div><label>Spesialisasi</label><input id="c_spec" value="${esc(coach.specialization||"")}"></div><div><label>Foto Profil</label><input id="c_photo_file" type="file" accept="image/jpeg,image/png"></div><div><label>Bank</label><input id="c_bank" value="${esc(coach.bank_name||"")}"></div><div><label>No. Rekening</label><input id="c_account" value="${esc(coach.bank_account||"")}"></div><div class="full-span"><label>Biodata</label><textarea id="c_bio">${esc(coach.bio||coach.notes||"")}</textarea></div></div><button class="btn primary" onclick="saveProfile()">Simpan Profil</button>`}
async function uploadCoachPhoto(file){if(!file)return null;if(!["image/jpeg","image/png"].includes(file.type)){toast("Foto harus JPG, JPEG, atau PNG.",false);return false}if(file.size>2*1024*1024){toast("Ukuran foto maksimal 2 MB.",false);return false}const ext=file.type==="image/png"?"png":"jpg";const path=`coaches/${coach.id}/profile.${ext}`;const {error}=await db.storage.from("profile-photos").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});if(error){toast("Upload foto gagal: "+error.message,false);return false}return path}
async function saveProfile(){const file=c_photo_file.files?.[0]||null;let photoPath=coach.photo_path||null;if(file){const uploaded=await uploadCoachPhoto(file);if(uploaded===false)return;photoPath=uploaded}const d={name:c_name.value,phone:c_phone.value,email:c_email.value,specialization:c_spec.value,photo_path:photoPath,bank_name:c_bank.value,bank_account:c_account.value,bio:c_bio.value};const {error}=await db.from("coaches").update(d).eq("id",coach.id);if(error){toast(error.message,false);return}if(file&&coach.photo_path&&coach.photo_path!==photoPath){await db.storage.from("profile-photos").remove([coach.photo_path])}Object.assign(coach,d);renderProfile();toast(file?"Profil dan foto berhasil diperbarui.":"Profil tersimpan.")}}
function renderSchedules(){scheduleRows.innerHTML=schedules.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.start_time||"")} ${x.end_time?"- "+esc(x.end_time):""}</td><td>${esc(x.students?.name||"-")}<div class="small">🏊 ${Number(x.students?.meeting_count||0)} kali latihan</div></td><td>${esc(x.location||"-")}</td><td>${esc(x.status||"-")}</td><td><button class="btn primary" onclick="openEval('${x.students?.id||""}')">Evaluasi</button></td></tr>`).join("")||"<tr><td colspan='6'>Belum ada jadwal.</td></tr>"}
function renderStudents(){studentRows.innerHTML=students.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.program||"-")}</td><td>${esc(x.level||"Beginner")}</td><td><b>${Number(x.meeting_count||0)} kali</b></td><td><button class="btn primary" onclick="openEval('${x.id}')">+ Evaluasi</button></td></tr>`).join("")||"<tr><td colspan='4'>Belum ada siswa.</td></tr>"}
function renderEvents(a){eventList.innerHTML=a.map(x=>`<div class="event-card"><span class="badge">Sub Event</span><h3>${esc(x.title)}</h3><p>${esc(x.description||"")}</p><p>📅 ${fmtDate(x.event_date)} ${x.start_time||""}</p><p>📍 ${esc(x.location||x.pools?.name||"-")}</p></div>`).join("")||"<p>Belum ada event.</p>"}
function renderPools(a){poolList.innerHTML=a.map(x=>`<div class="event-card"><h3>🏊 ${esc(x.name)}</h3><p>${esc(x.address||"")}</p><p>${esc(x.facilities||"")}</p>${x.map_url?`<a href="${esc(x.map_url)}" target="_blank">Lihat Maps</a>`:""}</div>`).join("")||"<p>Belum ada kolam.</p>"}
function renderIncome(a){incomeRows.innerHTML=a.map(x=>`<tr><td>${fmtDate(x.payment_date)}</td><td>${rupiah(x.amount)}</td><td>${esc(x.payment_type)}</td><td>${esc(x.status)}</td><td>${esc(x.notes||"-")}</td></tr>`).join("")||"<tr><td colspan='5'>Belum ada pembayaran.</td></tr>"}
function renderNotes(a){notifList.innerHTML=a.map(x=>`<div class="notice-card"><b>${esc(x.title)}</b><p>${esc(x.message)}</p></div>`).join("")||"Belum ada reminder."}
async function saveEval(){const d={student_id:e_student.value,coach_id:coach.id,evaluation_date:e_date.value,level:e_level.value,overall_score:Number(e_overall.value)||0,notes:e_notes.value};skills.forEach(s=>d[s[0]]=Math.min(100,Math.max(0,Number(document.getElementById(s[0]).value)||0)));const {error}=await db.from("student_evaluations").insert(d);if(error)toast(error.message,false);else{closeEval();toast("Evaluasi berhasil disimpan.")}}
init();
</script></body></html>
